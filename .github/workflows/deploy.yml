name: Deploy React App to Vercel

on:
  push:
    branches:
      - main # Chạy action khi có code push lên nhánh main

env:
  # Export cấu hình Vercel ra biến môi trường chung cho các step bên dưới
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Build-And-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Hoặc phiên bản Node.js bạn đang dùng

      - name: Install dependencies
        run: npm install

      - name: Inject Secrets into .env file
        run: |
          # Tạo file .env trắng
          touch .env
          
          # Ghi từng secret từ GitHub vào file .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "REACT_APP_SECRET_KEY=${{ secrets.REACT_APP_SECRET_KEY }}" >> .env
          
          # Ghi chú: Sử dụng toán tử >> để append (thêm vào cuối file), tránh ghi đè

      - name: Build Project
        run: npm run build
        # Quá trình này sẽ đọc file .env vừa được tạo ở bước trên để build app

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        # Deploy thẳng thư mục build đã được compile (CRA là 'build', Vite là 'dist')
        # Tham số --prod để deploy thẳng lên domain chính thức
        run: vercel deploy ./build --prod --token=${{ secrets.VERCEL_TOKEN }} --yes